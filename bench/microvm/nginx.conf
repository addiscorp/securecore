# docker/nginx.conf with PHP sent to the microVM instead of the php container
# (addiscorp/securecore#68, bench/microvm/bench.sh). Static files come from the same site volume.
server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # securecore.json sits at the site root (paths in it are relative to its folder), and so do
    # an editor's temporary copies of it (securecore.json.new, .bak, ~). Never serve any of them.
    # A regex location, first in the file, so it wins over every other regex location; nginx
    # matches the decoded, normalized URI, so %2E or /./ spellings land here too.
    location ~* /securecore\.json {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Plugin PHP files never run directly in core's PHP. (Redirecting them into the
    # sandbox instead is a later step.)
    location ~ ^/wp-content/plugins/.*\.php$ {
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        # The microVM: securecore-microvm's fpm.sock → vsock 9000 → php-fpm in the guest.
        fastcgi_pass unix:/run/mvm/fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
