; php-fpm in the microVM guest (addiscorp/securecore#68). Loaded after the image's zz-docker.conf.
[www]
; Only on the guest's loopback: the host reaches it through vsock 9000 (socat in init.sh).
listen = 127.0.0.1:9000
; The host driver's readiness check (securecore-microvm boot: a FastCGI request for /fpm-ping).
ping.path = /fpm-ping
; The image logs every request to stderr, which in the guest is the serial console, and an
; 8250 console is slow enough to show up in request latency.
access.log = /dev/null
