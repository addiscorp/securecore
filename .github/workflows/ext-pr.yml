# One cell of the extension's release matrix on pull requests (addiscorp/securecore#53, E8):
# PHP 8.3 NTS on linux-x86_64, only for PRs that touch the extension, the Docker files or the
# release scripts. The release (release.yml) runs all 16 cells; this catches a broken build or
# release check before merge for the price of one. It also runs the Rust gate (clippy -D warnings
# + cargo test, the whole workspace) in the same image.
name: Extension (PR)

on:
  pull_request:
    paths:
      - 'ext/**'
      - 'docker/**'
      - 'scripts/ext-*'
      - 'scripts/release-layout.sh'
      - 'scripts/package.sh'
      - 'test/release-check.sh'
      - 'test/release/**'
      - 'test/ext/securecore-status.php'
      - 'test/ext/microvm/**'
      - 'test/ext-microvm.sh'
      - 'test/promote-check.sh'
      - 'scripts/mirab-vm.sh'
      - 'scripts/guest-image.sh'
      - 'scripts/promote-check.sh'
      - 'bench/microvm/**'
      - '.github/workflows/ext-pr.yml'
      - '.github/workflows/promote.yml'

permissions:
  contents: read

concurrency:
  group: ext-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cell:
    name: ext php8.3-nts-linux-x86_64
    # APS 11 puts CI on mirab VMs, but Docker inside jobs is not in mirab's phase 1 (mirab#59,
    # row 12), and this job is Docker end to end (the build in PHP's official image, WordPress in
    # containers for the release check). So it runs on a GitHub-hosted runner, as APS 11 allows
    # for "jobs a mirab VM can't run yet"; it moves to mirab-linux-x64 when mirab#59 lands Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust gate (clippy -D warnings + cargo test, PHP 8.3 NTS)
        run: docker build -f docker/ext.Dockerfile --target check .
      - name: Build the cell (scripts/ext-build.sh)
        run: |
          set -euo pipefail
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" scripts/ext-build.sh 8.3 nts dist
      - name: Release check (test/release-check.sh)
        run: TMPDIR="$PWD/.tmp" test/release-check.sh 8.3 nts dist
      - name: Promote refuses a development mirab manifest (test/promote-check.sh)
        run: TMPDIR="$PWD/.tmp" test/promote-check.sh

  # Layer 1's microVM end to end (#71): WordPress served from a jailed Firecracker guest, the
  # four isolation values, the snapshot lifecycle. On ubuntu-24.04, as the cell job above runs;
  # its runners have /dev/kvm. No KVM is a failure, never a skip.
  microvm:
    name: microVM (test/ext-microvm.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: KVM is there (fail, never skip)
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [ -c /dev/kvm ] || { echo "::error::this runner has no /dev/kvm: the microVM tests need KVM"; exit 1; }
          ls -l /dev/kvm
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends socat jq e2fsprogs curl python3
      - name: The host launcher (cargo build --release -p securecore-fpm)
        run: |
          set -euo pipefail
          mkdir -p .tmp
          cd ext && CARGO_TARGET_DIR="$PWD/../.target" cargo build --locked --release -p securecore-fpm
      # Until mirab#89 ships Landlock and seccomp in mirab's kernel: mirab's recipe plus the five
      # lines (bench/microvm/kernel.sh), built from the guest-agent config at the commit of the
      # same mirab release the test runs (scripts/mirab-vm.sh: stable; while stable has no vm/,
      # it exits 3 and the newest canary is taken, as an override that is logged here).
      - name: The guest kernel with Landlock and seccomp (bench/microvm/kernel.sh)
        run: |
          set -uo pipefail
          TMPDIR="$PWD/.tmp" scripts/mirab-vm.sh .tmp/mirab; rc=$?
          if [ "$rc" = 3 ]; then
            manifest="https://mirab-releases.addis.gg/$(curl -fsSL https://mirab-releases.addis.gg/canary.json | jq -r .version)/vm/manifest.json"
            echo "::warning::mirab's stable release has no vm/ yet (mirab#89): using ${manifest} for the test"
            TMPDIR="$PWD/.tmp" scripts/mirab-vm.sh .tmp/mirab "$manifest" || exit 1
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
          commit=$(jq -er .commit .tmp/mirab/mirab-vm.json) || exit 1
          curl -fsSL -o .tmp/mirab-kernel-x86_64.config "https://raw.githubusercontent.com/addiscorp/mirab/${commit}/guest-agent/kernel-x86_64.config" || exit 1
          sudo -E env PATH="$PATH" TMPDIR="$PWD/.tmp" bench/microvm/kernel.sh .tmp/mirab-kernel-x86_64.config
      - name: test/ext-microvm.sh
        run: sudo -E env PATH="$PATH" TMPDIR="$PWD/.tmp" test/ext-microvm.sh
