# Builds and publishes CANARY releases only (APS 9). tag-canary.yml names the build and
# dispatches this against its tag. It never creates a stable vX.Y.Z tag or touches
# latest.json: that is promote.yml.
#
# R2 layout (bucket securecore-releases, APS 12, served at https://securecore-releases.addis.gg;
# https://securecore.addis.gg is the product site, which redirects /install.sh here). Directories are the
# release's full version with no "v":
#   <version>/securecore.zip          the plugin (scripts/package.sh)
#   <version>/securecore.zip.sha256
#   <version>/ext/securecore-php<v>-<ts>-linux-<arch>.so   the extension, one per matrix cell (E8)
#   <version>/ext/securecore-fpm-linux-<arch>              the layer-1 launcher, one per architecture
#   <version>/ext/securecore-vault.php                     the mu-plugin
#   <version>/ext/securecore.schema.json                   the JSON Schema for securecore.json
#   <version>/ext/mirab-vm.json                            layer 1's microVM from mirab (#71): the
#                                     kernel and Firecracker URLs and sha256s, resolved from mirab's
#                                     newest stable release once per release (the mirab job; no
#                                     vm/ there fails the release, which ships a guest image)
#   <version>/vm/linux-x86_64/rootfs.ext4.gz  layer 1's microVM guest image (#80), built once by
#                                     the guest job (scripts/guest-build.sh); guest-reproducible
#                                     reports, never gates, whether a rebuild matches
#   <version>/vm/manifest.json        its sha256 and size, gzipped and unpacked (APS 12: vm/ with
#                                     its own manifest, the shape of mirab's)
#   <version>/release.json            version, tag, commit, channel, zip + sha256, and "files": the
#                                     sha256 and size of every other file in <version>/ (APS 12)
#   canary.json                       the newest canary's release.json
#   latest.json                       the newest stable's (promote.yml)
#   install.sh                        the plugin installer, from this repo
#   install-ext.sh                    the extension installer (ext/install.sh)
#   staging/<tag>/<run id>/<cell>/    each matrix cell's checked files, until publish has
#                                     assembled the release (then deleted). Nothing reaches
#                                     <version>/ unless every cell built and passed its check.
#
# The extension matrix (addiscorp/securecore#53, E8): scripts/ext-cells.txt (PHP 8.1-8.4 x NTS/ZTS)
# x linux-x86_64/linux-arm64 = 16 cells. Each cell builds in that PHP's official image
# (scripts/ext-build.sh), then test/release-check.sh boots WordPress on that PHP with the built
# files installed by install-ext.sh and runs the smoke subset of the ext-* suites. Publish takes
# the checked bytes from staging, never a rebuild.
#   php.json                          the mirrored PHP builds: sha256, upstream URL + sha256
#   php/<build>/<version>/<platform>/php.tar.gz   static-php-cli builds, byte for byte
name: Release (canary)

on:
  workflow_dispatch:
    inputs:
      mirab_manifest:
        description: >-
          Development only: a mirab vm/manifest.json to take layer 1's microVM kernel and
          Firecracker from instead of mirab's newest stable release, e.g.
          https://mirab-releases.addis.gg/<version>/vm/manifest.json (a canary). Empty: stable.
        required: false
        default: ''
  push:
    tags:
      - 'v*-canary-*'

permissions:
  contents: read

env:
  R2_BUCKET_RELEASES: securecore-releases
  # aws-cli 2.23+ adds CRC checksums R2 doesn't accept on multipart uploads ("InvalidPart" on
  # CompleteMultipartUpload for the 106 MiB guest image); only send/verify them when required.
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

jobs:
  resolve:
    name: Resolve the canary
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      cells: ${{ steps.resolve.outputs.cells }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The ref is a canary of this commit and this version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is a stable tag. Stable releases come from promote.yml."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-([0-9a-f]{7})$ ]]; then
            echo "::error::${TAG} is not a canary ref. Expected vX.Y.Z-canary-<7-char sha>."
            exit 1
          fi
          BASE_VERSION="${BASH_REMATCH[1]}"
          SHA7="${BASH_REMATCH[2]}"
          TREE_VERSION="$(scripts/version.sh)"
          if [ "$BASE_VERSION" != "$TREE_VERSION" ]; then
            echo "::error::${TAG} names ${BASE_VERSION} but VERSION at this commit is ${TREE_VERSION}."
            exit 1
          fi
          if [ "$SHA7" != "$(git rev-parse --short=7 HEAD)" ]; then
            echo "::error::${TAG} names commit ${SHA7} but this ref is $(git rev-parse --short=7 HEAD)."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "cells=$(scripts/ext-cells.sh json)"
          } >> "$GITHUB_OUTPUT"

  # Layer 1's microVM from mirab (#71), resolved ONCE for the whole release (#80): mirab's newest
  # stable release, its vm/manifest.json and the Firecracker it pins (scripts/mirab-vm.sh: every
  # file downloaded and checked by sha256 before it is recorded), or the mirab_manifest override.
  # Every x86_64 cell's release check and publish take exactly this mirab-vm.json (its bytes, as
  # a job output), so what the cells boot is what ships. A release ships a guest image, which is
  # useless without a kernel and Firecracker: no vm/ in mirab's release fails the release.
  mirab:
    name: Resolve layer 1's microVM from mirab (scripts/mirab-vm.sh)
    needs: [resolve]
    runs-on: ubuntu-24.04
    outputs:
      vm_b64: ${{ steps.mirab.outputs.vm_b64 }}
      vm_sha256: ${{ steps.mirab.outputs.vm_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve it
        id: mirab
        env:
          MIRAB_MANIFEST: ${{ github.event.inputs.mirab_manifest }}
        run: |
          set -euo pipefail
          mkdir -p .tmp mirab
          TMPDIR="$PWD/.tmp" scripts/mirab-vm.sh mirab ${MIRAB_MANIFEST:+"$MIRAB_MANIFEST"} \
            || { echo "::error::mirab's microVM files didn't resolve (exit 3: its release has no vm/ images): a release with a guest image needs them"; exit 1; }
          cat mirab/mirab-vm.json
          {
            echo "vm_b64=$(base64 -w0 mirab/mirab-vm.json)"
            echo "vm_sha256=$(sha256sum mirab/mirab-vm.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

  # Layer 1's microVM guest image (#80): docker/ext.Dockerfile's `guest` target (its base pinned by
  # digest, apt from snapshot.debian.org) made into an ext4 inside the pinned guest-tools image by
  # scripts/guest-build.sh, ONCE. Its two sha256s are this job's outputs: every x86_64 cell checks
  # the staged bytes against them (not only against the SHA256SUMS beside them in R2), installs
  # them with install-ext.sh and boots the microVM from what the installer placed, and publish
  # ships the bytes that match them. Whether a rebuild gives the same bytes is guest-reproducible's
  # question, which never gates the release. GitHub-hosted for the same reason as the cells below
  # (Docker inside the job).
  guest:
    name: Guest image (layer 1's microVM)
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      gz_sha256: ${{ steps.build.outputs.gz_sha256 }}
      unpacked_sha256: ${{ steps.build.outputs.unpacked_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build it (scripts/guest-build.sh)
        id: build
        run: |
          set -euo pipefail
          mkdir -p guest
          scripts/guest-build.sh guest
          ls -l guest
          {
            echo "gz_sha256=$(sha256sum guest/rootfs-linux-x86_64.ext4.gz | cut -d' ' -f1)"
            echo "unpacked_sha256=$(gzip -dc guest/rootfs-linux-x86_64.ext4.gz | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Stage the guest image in R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::staging needs R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi
          prefix="staging/${TAG}/${GITHUB_RUN_ID}/guest"
          (cd guest && sha256sum -- rootfs-linux-x86_64.ext4.gz > SHA256SUMS)
          cat guest/SHA256SUMS
          for f in rootfs-linux-x86_64.ext4.gz SHA256SUMS; do scripts/r2.sh put "${prefix}/${f}" "guest/${f}"; done
          mkdir -p readback
          for f in rootfs-linux-x86_64.ext4.gz SHA256SUMS; do
            scripts/r2.sh get "${prefix}/${f}" "readback/${f}"
            cmp "guest/${f}" "readback/${f}" || { echo "::error::${prefix}/${f} does not read back as staged"; exit 1; }
          done
          echo "staged ${prefix}/"

  # Reports, never gates (#80): builds the guest image twice, the second from nothing in a builder
  # of its own (no layer, no RUN --mount cache), and fails, listing the files that differ, unless
  # both disks have the same sha256. continue-on-error: a red job here leaves the release green,
  # and its red is never hidden. Nothing it builds is staged or shipped.
  guest-reproducible:
    name: Guest image reproducibility (reports only, never gates the release)
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build twice and compare (scripts/guest-build.sh --check)
        run: scripts/guest-build.sh --check guest

  ext:
    name: ext php${{ matrix.cell.php }}-${{ matrix.cell.ts }}-linux-${{ matrix.arch }}
    needs: [resolve, mirab, guest]
    # APS 11 puts CI on mirab VMs, but Docker inside jobs is not in mirab's phase 1 (mirab#59,
    # row 12), and this job is Docker end to end: the build runs in each PHP's official image and
    # the release check boots WordPress (php, nginx, MariaDB) in containers. So it is one of the
    # "jobs a mirab VM can't run yet" APS 11 lets run on GitHub-hosted runners, listed here with
    # the reason; it moves to mirab-linux-x64 / mirab-linux-arm64 when mirab VMs run Docker. It
    # is also part of the release (it stages the bytes publish ships), which stays hosted anyway.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.resolve.outputs.cells) }}
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PHP: ${{ matrix.cell.php }}
      TS: ${{ matrix.cell.ts }}
      ARCH: ${{ matrix.arch }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the cell in its PHP image (scripts/ext-build.sh)
        run: |
          set -euo pipefail
          [ "$(scripts/ext-cells.sh arch)" = "$ARCH" ] || { echo "::error::this runner's Docker is $(scripts/ext-cells.sh arch), not $ARCH"; exit 1; }
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" scripts/ext-build.sh "$PHP" "$TS" dist
          ls -l dist
      # x86_64: the staged guest image and the release's mirab-vm.json join the cell's files for
      # the check (not its staging: publish takes the guest and mirab jobs'), so the installer
      # places them and the check boots them. The image must be the guest job's, by the sha256s
      # that job output, not only by the SHA256SUMS staged beside it.
      - name: The guest image from staging, and mirab-vm.json (x86_64)
        if: matrix.arch == 'x86_64'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GUEST_GZ_SHA256: ${{ needs.guest.outputs.gz_sha256 }}
          GUEST_UNPACKED_SHA256: ${{ needs.guest.outputs.unpacked_sha256 }}
          MIRAB_VM_B64: ${{ needs.mirab.outputs.vm_b64 }}
          MIRAB_VM_SHA256: ${{ needs.mirab.outputs.vm_sha256 }}
        run: |
          set -euo pipefail
          prefix="staging/${TAG}/${GITHUB_RUN_ID}/guest"
          mkdir -p guest
          scripts/r2.sh get "${prefix}/SHA256SUMS" guest/SHA256SUMS
          scripts/r2.sh get "${prefix}/rootfs-linux-x86_64.ext4.gz" guest/rootfs-linux-x86_64.ext4.gz
          (cd guest && sha256sum -c --strict SHA256SUMS)
          [ "$(sha256sum guest/rootfs-linux-x86_64.ext4.gz | cut -d' ' -f1)" = "$GUEST_GZ_SHA256" ] \
            || { echo "::error::the staged guest image is not the one the guest job built (${GUEST_GZ_SHA256})"; exit 1; }
          [ "$(gzip -dc guest/rootfs-linux-x86_64.ext4.gz | sha256sum | cut -d' ' -f1)" = "$GUEST_UNPACKED_SHA256" ] \
            || { echo "::error::the staged guest image does not unpack to the guest job's ${GUEST_UNPACKED_SHA256}"; exit 1; }
          printf '%s' "$MIRAB_VM_B64" | base64 -d > guest/mirab-vm.json
          [ "$(sha256sum guest/mirab-vm.json | cut -d' ' -f1)" = "$MIRAB_VM_SHA256" ] || { echo "::error::mirab-vm.json did not survive the job output"; exit 1; }
      - name: Release check (test/release-check.sh) — WordPress on this PHP with these bytes
        run: |
          set -euo pipefail
          mkdir -p check
          cp dist/* check/
          if [ -f guest/rootfs-linux-x86_64.ext4.gz ]; then cp guest/rootfs-linux-x86_64.ext4.gz guest/mirab-vm.json check/; fi
          TMPDIR="$PWD/.tmp" test/release-check.sh "$PHP" "$TS" check
      - name: Stage the checked files in R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::staging needs R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi
          cell="php${PHP}-${TS}-linux-${ARCH}"
          prefix="staging/${TAG}/${GITHUB_RUN_ID}/${cell}"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          for f in dist/*; do scripts/r2.sh put "${prefix}/${f#dist/}" "$f"; done
          # Read back what was staged before it counts.
          mkdir -p readback
          for f in dist/*; do
            scripts/r2.sh get "${prefix}/${f#dist/}" "readback/${f#dist/}"
            cmp "$f" "readback/${f#dist/}" || { echo "::error::${prefix}/${f#dist/} does not read back as staged"; exit 1; }
          done
          echo "staged ${prefix}/"

  publish:
    name: Build and publish to R2
    needs: [resolve, mirab, guest, ext]
    # Publishing runs on GitHub-hosted runners (APS 11). The plugin zip is built here; the
    # extension's files come from the ext cells' staging, checked against each cell's SHA256SUMS.
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The scripts pass shellcheck (pinned to 0.11.0, the version used locally)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -s sh -S info install.sh bin/securecore-worker scripts/*.sh ext/install.sh test/release-check.sh test/release/sapi-microvm
      - name: Release keys are present
        run: |
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::publishing needs R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi
      # Every cell's staged files, checked against the SHA256SUMS that cell wrote after its release
      # check passed: these are the bytes that were checked. Every cell must be there, and every
      # cell of one architecture must have built the same launcher (it is plain Rust, no PHP), so
      # the one shipped per architecture is the one every cell's layer-1 check ran.
      - name: Take the extension's checked files from staging
        env:
          CELLS: ${{ needs.resolve.outputs.cells }}
          GUEST_GZ_SHA256: ${{ needs.guest.outputs.gz_sha256 }}
          GUEST_UNPACKED_SHA256: ${{ needs.guest.outputs.unpacked_sha256 }}
          MIRAB_VM_B64: ${{ needs.mirab.outputs.vm_b64 }}
          MIRAB_VM_SHA256: ${{ needs.mirab.outputs.vm_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p staged ext-dist
          for arch in $(scripts/ext-cells.sh arches); do
            launcher=""
            for row in $(echo "$CELLS" | jq -r '.[] | "\(.php)-\(.ts)"'); do
              cell="php${row}-linux-${arch}"
              prefix="staging/${TAG}/${GITHUB_RUN_ID}/${cell}"
              mkdir -p "staged/${cell}"
              scripts/r2.sh get "${prefix}/SHA256SUMS" "staged/${cell}/SHA256SUMS" \
                || { echo "::error::${cell} staged nothing: it did not pass"; exit 1; }
              while read -r _ f; do
                scripts/r2.sh get "${prefix}/${f}" "staged/${cell}/${f}"
              done < "staged/${cell}/SHA256SUMS"
              (cd "staged/${cell}" && sha256sum -c --strict SHA256SUMS) || { echo "::error::${cell}'s staged files do not match its SHA256SUMS"; exit 1; }
              so="securecore-${cell}.so"
              [ -f "staged/${cell}/${so}" ] || { echo "::error::${cell} staged no ${so}"; exit 1; }
              cp "staged/${cell}/${so}" ext-dist/
              sum=$(sha256sum "staged/${cell}/securecore-fpm-linux-${arch}" | cut -d' ' -f1)
              if [ -z "$launcher" ]; then
                launcher=$sum
                cp "staged/${cell}/securecore-fpm-linux-${arch}" ext-dist/
              elif [ "$sum" != "$launcher" ]; then
                echo "::error::${cell} built a different securecore-fpm-linux-${arch} (${sum}, others ${launcher}): the launcher build is not reproducible across cells"
                exit 1
              fi
            done
          done
          # The guest image (#80), as the guest job staged it and every x86_64 cell booted it.
          prefix="staging/${TAG}/${GITHUB_RUN_ID}/guest"
          mkdir -p staged/guest
          scripts/r2.sh get "${prefix}/SHA256SUMS" staged/guest/SHA256SUMS \
            || { echo "::error::the guest job staged nothing"; exit 1; }
          scripts/r2.sh get "${prefix}/rootfs-linux-x86_64.ext4.gz" staged/guest/rootfs-linux-x86_64.ext4.gz
          (cd staged/guest && sha256sum -c --strict SHA256SUMS) || { echo "::error::the staged guest image does not match its SHA256SUMS"; exit 1; }
          # And it is the guest job's, by the sha256s that job output (#80).
          [ "$(sha256sum staged/guest/rootfs-linux-x86_64.ext4.gz | cut -d' ' -f1)" = "$GUEST_GZ_SHA256" ] \
            || { echo "::error::the staged guest image is not the one the guest job built (${GUEST_GZ_SHA256})"; exit 1; }
          [ "$(gzip -dc staged/guest/rootfs-linux-x86_64.ext4.gz | sha256sum | cut -d' ' -f1)" = "$GUEST_UNPACKED_SHA256" ] \
            || { echo "::error::the staged guest image does not unpack to the guest job's ${GUEST_UNPACKED_SHA256}"; exit 1; }
          cp staged/guest/rootfs-linux-x86_64.ext4.gz ext-dist/
          # Layer 1's microVM from mirab (#71): the mirab job's mirab-vm.json, the bytes every
          # x86_64 cell's release check booted, never a second resolution.
          printf '%s' "$MIRAB_VM_B64" | base64 -d > ext-dist/mirab-vm.json
          [ "$(sha256sum ext-dist/mirab-vm.json | cut -d' ' -f1)" = "$MIRAB_VM_SHA256" ] || { echo "::error::mirab-vm.json did not survive the job output"; exit 1; }
          cat ext-dist/mirab-vm.json
          ls -l ext-dist
      - name: Lay out the release (scripts/release-layout.sh, the same script the tests serve)
        run: |
          set -euo pipefail
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" scripts/release-layout.sh "$VERSION" "$TAG" "$GITHUB_SHA" canary release ext-dist
          unzip -l "release/${VERSION}/securecore.zip"
          cat "release/${VERSION}/release.json"
      # PHP for install.sh, mirrored before the installer that needs it is published:
      # static-php-cli's prebuilt builds (scripts/php-builds.txt), copied byte for byte into
      # php/<build>/<version>/<platform>/ with php.json recording our sha256, the upstream URL
      # and the upstream file's sha256 at mirror time. Entries already in the bucket's
      # php.json are kept, not downloaded again. We never build PHP.
      - name: Mirror PHP builds (static-php-cli) into php/
        run: |
          set -euo pipefail
          scripts/mirror-php.sh mirror "https://securecore-releases.addis.gg/php.json?run=${GITHUB_RUN_ID}"
          if [ -d mirror/php ]; then
            aws s3 sync mirror/php/ "s3://${R2_BUCKET_RELEASES}/php/" --endpoint-url="${R2_ENDPOINT}" \
              --content-type "application/gzip"
          fi
          aws s3 cp mirror/php.json "s3://${R2_BUCKET_RELEASES}/php.json" --endpoint-url="${R2_ENDPOINT}" \
            --content-type "application/json" --cache-control "no-cache"
      - name: Read every PHP build back by its php.json sha256
        run: |
          set -euo pipefail
          bust="?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/php.json${bust}" -o served-php.json
          cmp served-php.json mirror/php.json || { echo "::error::https://securecore-releases.addis.gg/php.json does not match"; exit 1; }
          jq -r '.builds[][][] | "\(.path) \(.sha256)"' mirror/php.json | while read -r path want; do
            got="$(curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/${path}" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$want" ] || { echo "::error::${path} served from R2 does not match php.json"; exit 1; }
            echo "ok ${path} ${got}"
          done
      - name: Upload the versioned release
        run: aws s3 sync "release/${VERSION}/" "s3://${R2_BUCKET_RELEASES}/${VERSION}/" --endpoint-url="${R2_ENDPOINT}"
      # Every uploaded file of <version>/, read back over HTTPS and compared byte for byte
      # (sha256) with what was built, BEFORE canary.json or the installers point at it (APS 12:
      # "every upload is read back from the public URL before the release counts"; #80). Until
      # then the version folder is reachable only by its name. curl, like the installer: Cloudflare
      # turns away Python's default user agent on these domains.
      - name: Read the versioned release back from securecore-releases.addis.gg
        run: |
          set -euo pipefail
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          for host in securecore-releases.addis.gg; do
            curl -fsSL --retry 5 --retry-all-errors "https://${host}/${VERSION}/release.json" -o served
            [ "$(sum served)" = "$(sum "release/${VERSION}/release.json")" ] || { echo "::error::https://${host}/${VERSION}/release.json does not match"; exit 1; }
            # Every file the manifest names, by the sha256 it promises installers.
            jq -r '.files | to_entries[] | "\(.key) \(.value.sha256)"' "release/${VERSION}/release.json" | while read -r f want; do
              curl -fsSL --retry 5 --retry-all-errors "https://${host}/${VERSION}/${f}" -o served
              [ "$(sum served)" = "$want" ] || { echo "::error::https://${host}/${VERSION}/${f} does not match release.json"; exit 1; }
              echo "ok https://${host}/${VERSION}/${f} ${want}"
            done
          done
          # And the zip matches the sha256 the manifest promises installers.
          curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/${VERSION}/securecore.zip" -o served.zip
          [ "$(sum served.zip)" = "$(jq -r .sha256 "release/${VERSION}/release.json")" ] || { echo "::error::served zip does not match release.json"; exit 1; }
          # The guest image (#80) as served, gzipped and unpacked, against release.json and
          # vm/manifest.json: scripts/promote-check.sh on the bytes read back (without mirab-vm.json,
          # whose channel check is promote's: a mirab_manifest canary publishes, never promotes).
          mkdir -p "readback/${VERSION}/vm/linux-x86_64"
          curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/${VERSION}/release.json" -o "readback/${VERSION}/release.json"
          for f in vm/linux-x86_64/rootfs.ext4.gz vm/manifest.json; do
            if jq -e --arg f "$f" '.files[$f]' "release/${VERSION}/release.json" > /dev/null; then
              curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/${VERSION}/${f}" -o "readback/${VERSION}/${f}"
            fi
          done
          scripts/promote-check.sh "readback/${VERSION}"
      # Only now does anything point at the new version.
      - name: Publish the installer and point canary.json at this release
        run: |
          set -euo pipefail
          for f in install.sh install-ext.sh; do
            aws s3 cp "release/$f" "s3://${R2_BUCKET_RELEASES}/$f" --endpoint-url="${R2_ENDPOINT}" \
              --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
          done
          aws s3 cp release/canary.json "s3://${R2_BUCKET_RELEASES}/canary.json" --endpoint-url="${R2_ENDPOINT}" \
            --content-type "application/json" --cache-control "no-cache"
      # The mutable files get a query string so a cached copy can't pass for the new one.
      - name: Read the installers and canary.json back
        run: |
          set -euo pipefail
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          bust="?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for f in install.sh install-ext.sh canary.json; do
            curl -fsSL --retry 5 --retry-all-errors "https://securecore-releases.addis.gg/${f}${bust}" -o served
            [ "$(sum served)" = "$(sum "release/${f}")" ] || { echo "::error::https://securecore-releases.addis.gg/${f} does not match what was uploaded"; exit 1; }
            echo "ok https://securecore-releases.addis.gg/${f} $(sum served)"
          done
      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="release/${VERSION}/release.json release/${VERSION}/securecore.zip"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $files --repo "${{ github.repository }}" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $files --repo "${{ github.repository }}" \
              --title "securecore ${VERSION} (canary)" --prerelease \
              --notes "Canary build of ${GITHUB_SHA}. Install the extension: curl -fsSL https://securecore.addis.gg/install.sh | sudo sh -s -- --canary (from the WordPress folder, or it uses /var/www/html)"
          fi
      - name: Remove this run's staging
        run: |
          set -euo pipefail
          for d in staged/*/; do
            cell=$(basename "$d")
            for f in "$d"*; do scripts/r2.sh delete "staging/${TAG}/${GITHUB_RUN_ID}/${cell}/$(basename "$f")"; done
          done
      - name: Summary
        run: |
          {
            echo "### securecore ${VERSION} (canary)"
            echo "- https://securecore-releases.addis.gg/${VERSION}/release.json"
            echo "- the extension: $(jq -r '.files | keys[] | select(endswith(".so"))' "release/${VERSION}/release.json" | wc -l) cells, each release-checked on WordPress before staging"
            echo "- canary.json, install.sh and install-ext.sh now point here; latest.json was not touched (promote.yml)"
            echo "- every file in release.json read back from securecore-releases.addis.gg and matched by sha256"
            jq -r '.files["vm/linux-x86_64/rootfs.ext4.gz"] // empty | "- the microVM guest image: \(.bytes) bytes gzipped, \(.unpacked_bytes) unpacked (\(.unpacked_sha256)), booted by every x86_64 cell; reproducibility is the guest-reproducible job'"'"'s report"' "release/${VERSION}/release.json"
          } >> "$GITHUB_STEP_SUMMARY"
