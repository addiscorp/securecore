# A real WordPress install for SecureCore: nginx + php-fpm (WordPress core) + MariaDB, plus
# the SecureCore worker. The worker is one process for all sandboxed plugins, in its own
# container with NO NETWORK; core reaches it over a unix socket on the shared `sock` volume.
name: securecore
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-db-password
      MARIADB_ROOT_PASSWORD: root-db-password
    volumes:
      - db:/var/lib/mysql

  php:
    build: { context: .., dockerfile: docker/php.Dockerfile }
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-db-password
    volumes:
      - wp:/var/www/html
      - sock:/run/securecore

  # The sandbox. No network at all; only the WordPress files (read-only) and the socket dir.
  worker:
    build: { context: .., dockerfile: docker/worker.Dockerfile }
    network_mode: none
    restart: unless-stopped
    environment: {}
    command:
      - sh
      - -c
      - >
        exec php
        -d opcache.enable=1 -d opcache.enable_cli=1 -d opcache.validate_timestamps=0
        -d disable_functions=exec,shell_exec,system,passthru,proc_open,popen,proc_close,proc_get_status,proc_terminate,pcntl_exec
        /opt/securecore/worker.php /run/securecore/worker.sock
        /var/www/html/wp-content/plugins /var/www/html/wp-content/securecore/manifests
    volumes:
      - wp:/var/www/html:ro
      - sock:/run/securecore

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    depends_on: [php]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - wp:/var/www/html:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-db-password
    volumes:
      - wp:/var/www/html

volumes:
  db:
  wp:
  sock:
