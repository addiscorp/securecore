; The SecureCore extension (ext/README.md). Must be set here (php.ini / conf.d), not in a
; php-fpm pool: the file is loaded once at startup.
extension=/usr/local/lib/php/extensions/securecore.so
; The file sits at the site root: relative paths in it are relative to its folder. nginx must
; never serve it (docker/nginx.conf).
securecore.config=/var/www/html/securecore.json
