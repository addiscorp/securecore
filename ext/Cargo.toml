# SecureCore as a PHP extension (addiscorp/securecore#53).
#   config/  securecore-config: the securecore.json types, loader and JSON Schema. Plain Rust, no
#            PHP, so the securecore-fpm launcher (E6) reads the file with the same code.
#   attribution/  securecore-attribution: path → component (plugin, mu-plugin, theme, core) and
#            the rules for who is responsible on a PHP stack. Plain Rust, no PHP.
#   php/     securecore-php: the extension itself (ext-php-rs), built into securecore.so.
#   fpm/     securecore-fpm: layer 1, the launcher that starts php-fpm inside gelada. Plain Rust.
# The php crate needs PHP's headers (php-config) to build; docker/ext.Dockerfile builds it
# against PHP 8.3 NTS. On a machine without PHP, `cargo test` (the default members) still works.
[workspace]
resolver = "3"
members = ["config", "attribution", "db", "php", "fpm"]
default-members = ["config", "attribution", "db", "fpm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Exact versions from crates.io (APS 10).
[workspace.dependencies]
ext-php-rs = "=0.16.4"
gelada = "=0.3.0"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
# The vault's native salted pluggables (E3): hash_hmac over the real keys, in the extension.
hmac = "=0.13.0"
md-5 = "=0.11.0"
sha1 = "=0.11.0"
digest = "=0.11.3"
libc = "=0.2.191"
# The database policy (E4): a maintained MySQL-dialect SQL parser, with the AST visitor.
sqlparser = { version = "=0.63.0", features = ["visitor"] }
