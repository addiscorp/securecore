[package]
name = "securecore-php"
description = "The SecureCore PHP extension (addiscorp/securecore#53)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# PHP loads lib<name>.so; the Dockerfile installs it as securecore.so.
name = "securecore"
crate-type = ["cdylib"]
# A test binary can't link: the PHP symbols resolve only when php loads the .so. The extension
# is tested by loading it (test/ext-config.sh).
test = false
doctest = false

[dependencies]
# `observer`: the Zend observer API bindings (zend_observer_fcall_register), for the attribution
# recorder. We register our own observer; ext-php-rs's own observer wrappers stay unused.
ext-php-rs = { workspace = true, features = ["observer"] }
securecore-config = { path = "../config" }
securecore-attribution = { path = "../attribution" }
# The database policy (E4): parse + decide, plain Rust.
securecore-db = { path = "../db" }
# Layer 3 (E7): the wire, the snapshot allowlist and the isolated child's limits, plain Rust.
securecore-layer3 = { path = "../layer3" }
# The vault (E3): HMAC over the real keys natively, so the key never reaches PHP; libc for the
# C environ masking at MINIT.
hmac = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
digest = { workspace = true }
libc = { workspace = true }
