; php-fpm in the microVM guest (addiscorp/securecore#71). Loaded after the image's zz-docker.conf.
[global]
; A reload (the launcher's SIGUSR2/SIGHUP) stops php-fpm gracefully: in-flight requests get up to
; this long to finish (securecore-init's RELOAD_GRACE is the same 20 s).
process_control_timeout = 20s

[www]
; Only on the guest's loopback: the host reaches it through vsock 9000 (securecore-init).
listen = 127.0.0.1:9000
; The host driver's readiness check: a FastCGI request for /fpm-ping.
ping.path = /fpm-ping
; The image logs every request to stderr, which goes to the host over vsock; a line per request
; is noise there, and costs time per request.
access.log = /dev/null
